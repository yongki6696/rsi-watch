# BTC 자동매매 봇 설정 예시 — 하이퍼리퀴드, 하이브리드 모드
#   - 추세추종(일봉 20일 돌파 / 10일 이탈)은 자동으로 주문
#   - 차슐랭 채널 방식 신호(15분봉)는 텔레그램 알림만 (주문 없음)
# 복사해서 쓰세요:  cp config.example.yaml config.yaml
# 적지 않은 항목은 bot/config.py 의 기본값을 씁니다. 키 이름을 틀리면 바로 오류가 납니다.

mode: hybrid                 # hybrid = 추세추종 자동매매 + 채널 신호 알림 / smc = 채널 방식 자동매매
alerts: true                 # 채널 방식 신호 알림 켜기
symbol: BTC/USDC:USDC        # 하이퍼리퀴드 BTC 무기한. 바이낸스 선물은 BTC/USDT:USDT
timeframe: 15m               # 채널 방식: 진입 봉 (내부 구조 전환 확인)
liquidity_timeframe: 1h      # 채널 방식: 내부 유동성(단기 고점·저점)과 핀바를 보는 봉
structure_timeframe: 4h      # 채널 방식: 가격 구조, 외부 유동성, 오더블록을 보는 봉
timezone: Asia/Seoul
initial_equity: 10000        # 백테스트/모의매매 시작 자산 (실거래는 거래소 잔고 사용)

exchange:
  id: hyperliquid            # ccxt 거래소 id: hyperliquid / binance / bybit / okx / upbit ...
  market_type: future        # future = 무기한 선물 / spot = 현물
  sandbox: true              # ★ 하이퍼리퀴드 테스트넷. 충분히 확인한 뒤에만 false
  demo: false                # (바이낸스 데모 트레이딩 전용)
  leverage: 2                # 거래소 레버리지 한도. 실제 노출은 trend.exposure (1배)
  margin_mode: isolated      # 격리 마진: 이 포지션 증거금만 위험에 노출
  wallet_address_env: HYPERLIQUID_WALLET_ADDRESS  # 메인 지갑 주소 (환경변수 이름)
  private_key_env: HYPERLIQUID_PRIVATE_KEY        # API 지갑 개인키 (환경변수 이름, 출금 권한 없음)
  api_key_env: EXCHANGE_API_KEY                   # (바이낸스 등 API 키 방식 거래소용)
  secret_env: EXCHANGE_API_SECRET
  password_env: EXCHANGE_API_PASSWORD

trend:                       # ★ 실제 주문을 내는 추세추종
  timeframe: 1d              # 일봉 마감(UTC 00:00 = 한국 오전 9시) 직후 판단
  entry_days: 20             # 일봉 종가 > 직전 20일 최고가 → 롱 진입
  exit_days: 10              # 일봉 종가 < 직전 10일 최저가 → 청산
  allow_short: false         # 숏은 검증에서 성과가 나빠 끔
  exposure: 1.0              # 포지션 크기 = 자산 x 1배 (BTC 를 현물로 산 것과 같은 노출)
  disaster_stop_atr: 2.0     # 거래소 비상 손절 = 10일 최저가 - ATR x 2 (봇이 꺼져도 폭락 대비)
  atr_period: 20
  max_delay_hours: 6         # 일봉 마감 후 6시간 넘게 지나 켜지면 그날 판단은 건너뜀

strategy:                    # 채널 방식 규칙 (hybrid 에서는 알림에만 사용)
  # 유동성: 스윙 고점 뒤 = 바이사이드(숏 손절 물량), 스윙 저점 뒤 = 셀사이드(롱 손절 물량)
  liq_pivot_window: 5        # 1h 단기 고점/저점 = 내부 유동성 (좌우 5봉)
  ext_pivot_window: 3        # 4h 고점/저점 = 외부 유동성, 가격 구조 (좌우 3봉)
  entry_pivot_window: 2      # 15m 내부 구조 스윙 (좌우 2봉)
  # 셋업과 트리거
  enable_sweep: true         # 유동성 훼손 후 진입
  sweep_levels: all          # all = 내부+외부 / external = 4h 외부 유동성만
  enable_ob: true            # 오더블록(서플라이/디맨드 존) 터치 후 진입
  enable_pinbar: true        # 훼손한 1h 봉이 핀바로 안쪽 마감 → 진입
  enable_choch: true         # 훼손 뒤 15m 내부 구조 전환(직전 스윙 이탈 마감) → 진입
  arm_bars: 12               # 훼손/터치 후 12봉(15m x 12 = 3시간) 안에 전환이 나와야 함
  sweep_max_atr: 1.5         # 레벨을 1h ATR x 1.5 보다 더 뚫으면 함정이 아니라 돌파로 보고 패스
  pinbar_wick: 0.5
  ob_impulse_atr: 1.5
  bias_mode: "off"           # "off" = 양방향 (채널 방식) / structure = 4h 구조 방향으로만
  # 손절·익절 (채널: "부분 익절 후 잔여 물량은 본절 로스")
  stop_buffer_atr: 0.1
  min_stop_atr: 0.8          # 손절폭이 1h ATR x 0.8 보다 좁으면 수수료 비중이 커서 패스
  max_stop_atr: 3.0
  entry_mode: market         # market = 다음 봉 시장가 / limit = 신호 봉 종가 지정가 (백테스트 전용, 실시간 미지원)
  limit_wait_bars: 4
  tp1_r: 1.5                 # 1.5R 에서
  tp1_fraction: 0.5          # 절반 익절 → 손절을 본절로
  runner: trail              # 남은 절반: trail = 1h 스윙 / trail_ext = 4h 스윙 따라 손절 이동 / hold = 본절 유지
  tp2_r: 0                   # 남은 물량 최종 목표 (0 = 없음)

risk:
  risk_per_trade: 0.01       # 한 번 손절 시 자산의 1%만 잃도록 수량 계산
  max_leverage: 3
  daily_loss_limit: 0.03     # 하루 -3% 면 그날 신규 진입 중지
  max_consecutive_losses: 3  # 3연패면 그날 신규 진입 중지

costs:                       # 백테스트·모의매매용 (실거래는 실제 체결 기준)
  fee_rate: 0.00045          # 하이퍼리퀴드 기본 등급 시장가 0.045% (바이낸스 선물 0.05%)
  maker_fee_rate: 0.00015    # 지정가 0.015% (바이낸스 0.02%)
  slippage: 0.0002
  funding_apr: 0.11          # 롱 보유 중 펀딩비 가정 (연 11%, 상승장에서는 더 높을 수 있음)

live:
  enabled: false             # ★ 실거래 이중 안전장치: true + 실행 시 --live 둘 다 있어야 실주문
  poll_seconds: 30
  history_bars: 5000         # 채널 신호용 15m 봉 수 (하이퍼리퀴드는 최근 5,000봉까지만 제공)
  exits: auto                # auto: 선물은 거래소 손절/익절 주문, 현물은 봇이 직접 감시
  state_file: state.json
  log_file: trader.log

notify:                      # 텔레그램 알림 (환경변수가 비어 있으면 로그만 남김)
  telegram_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_env: TELEGRAM_CHAT_ID

# ── 다른 거래소 예시 ──
# 빗썸 현물(원화, 롱만, 펀딩비 없음): API 2.0 키 → EXCHANGE_API_KEY / EXCHANGE_API_SECRET
#   symbol: BTC/KRW
#   exchange: {id: bithumb, market_type: spot, sandbox: false}   # 빗썸은 테스트넷 없음 → 모의매매 후 소액
#   risk: {max_leverage: 1}
#   costs: {fee_rate: 0.0004, maker_fee_rate: 0.0004, slippage: 0.0003, funding_apr: 0}  # 본인 수수료로 수정
# 바이낸스 선물: symbol: BTC/USDT:USDT / exchange: {id: binance, market_type: future, sandbox: true}
#               costs: {fee_rate: 0.0005, maker_fee_rate: 0.0002}
# 업비트 현물(롱만): symbol: BTC/KRW / exchange: {id: upbit, market_type: spot, sandbox: false}
#                   risk: {max_leverage: 1} / costs: {fee_rate: 0.0005, maker_fee_rate: 0.0005, funding_apr: 0}
