# 오더허브 + Caddy(HTTPS 인증서 자동 발급)
# 사용법: .env 파일에 DOMAIN, PUBLIC_URL 을 적고 `docker compose up -d --build`
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "true"
      DATA_DIR: /app/data
    volumes:
      - orderhub-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 .env 에 적어주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  orderhub-data:
  caddy-data:
  caddy-config:
