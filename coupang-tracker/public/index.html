<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="장바구니 시세">
<meta name="description" content="쿠팡 장바구니에 담은 상품의 가격 변동을 주식 차트처럼 실시간으로 확인하세요.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>장바구니 시세</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#/"><span class="live-dot" id="live-dot" title="실시간 연결 상태"></span>장바구니 시세</a>
    <div class="top-actions">
      <span class="demo-pill" id="demo-pill" hidden>데모</span>
      <button class="btn small" id="btn-check" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
        <span>지금 확인</span>
      </button>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap"><div class="status-line" id="status-line" aria-live="polite"></div></div>
</header>

<main class="wrap" id="view-list">
  <div class="banner" id="demo-banner" hidden>
    <b>데모 모드</b> — 가상의 상품과 가격으로 화면을 체험하는 중이에요. 20초마다 가격이 바뀌어요.
    실제 추적은 <code>npm start</code> 로 실행하세요.
  </div>
  <section class="summary" id="summary" aria-label="요약"></section>

  <form class="card add" id="add-form" autocomplete="off">
    <input id="add-input" type="text" inputmode="url" placeholder="쿠팡 상품 링크를 붙여넣으세요" aria-label="쿠팡 상품 링크">
    <button class="btn" type="submit" id="add-btn">추가</button>
  </form>
  <div class="add-row2">
    <button class="btn ghost small" type="button" id="btn-import">🛒 장바구니 가져오기</button>
  </div>

  <div class="filters" id="filters" role="toolbar" aria-label="목록 필터"></div>
  <section class="card list" id="list" aria-label="추적 중인 상품"></section>
  <p class="foot">가격은 쿠팡 페이지에서 확인한 시점의 값이에요. 쿠폰·카드 할인은 반영되지 않을 수 있어요.</p>
</main>

<main class="wrap" id="view-detail" hidden></main>

<div id="sheet-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/vendor/lightweight-charts.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
